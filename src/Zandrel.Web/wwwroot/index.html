<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0" />

    <base href="/" />

    <title>Zandrel | Soluciones de software para tu negocio</title>

    <meta name="description"
          content="Soluciones de software profesionales, accesibles y adaptadas a las necesidades y presupuesto de tu negocio." />

    <meta name="theme-color"
          content="#F8F9FC" />

    <link rel="icon"
          type="image/png"
          href="images/brand/zandrel-mark-transparent.png" />

    <link rel="stylesheet"
          href="css/app.css" />

    <link rel="stylesheet"
          href="Zandrel.Web.styles.css" />
</head>

<body>

    <div id="app"
         class="app-loading">

        <div class="app-loading__content">

            <img class="app-loading__mark"
                 src="images/brand/zandrel-mark.png"
                 alt="Zandrel" />

            <div class="app-loading__bar"
                 role="progressbar"
                 aria-label="Cargando Zandrel"></div>

        </div>

    </div>

    <div id="blazor-error-ui">

        Ocurrió un error inesperado.

        <a href=""
           class="reload">
            Recargar
        </a>

        <a class="dismiss">
            ×
        </a>

    </div>

    <script src="_framework/blazor.webassembly.js"></script>

</body>

</html>
