<!DOCTYPE html>
<html lang="es-MX">

<head>

    <meta charset="utf-8" />

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <base href="/" />

    <title>Zandrel | Soluciones de software para tu negocio</title>

    <meta name="description"
          content="Soluciones de software profesionales, accesibles y adaptadas a las necesidades y presupuesto de tu negocio." />

    <meta name="robots"
          content="index, follow, max-image-preview:large" />

    <meta name="theme-color"
          content="#F8F9FC" />

    <link rel="canonical"
          href="https://zandrel-software.github.io/zandrel-website/" />

    <!-- Open Graph -->

    <meta property="og:type"
          content="website" />

    <meta property="og:locale"
          content="es_MX" />

    <meta property="og:site_name"
          content="Zandrel" />

    <meta property="og:title"
          content="Zandrel | Soluciones de software para tu negocio" />

    <meta property="og:description"
          content="Soluciones de software profesionales, accesibles y adaptadas a las necesidades y presupuesto de tu negocio." />

          content="https://zandrel-software.github.io/zandrel-website/images/social/zandrel-social-preview.png" />

          content="image/png" />

    <meta property="og:image:width"
          content="1200" />

          content="630" />

    <meta property="og:image:alt"
          content="Zandrel — Soluciones de software para tu negocio" />

    <!-- X / Twitter -->

    <meta name="twitter:card"
          content="summary_large_image" />

    <meta name="twitter:title"
          content="Zandrel | Soluciones de software para tu negocio" />

    <meta name="twitter:description"
          content="Soluciones de software profesionales, accesibles y adaptadas a las necesidades y presupuesto de tu negocio." />

          content="https://zandrel-software.github.io/zandrel-website/images/social/zandrel-social-preview.png" />

    <meta name="twitter:image:alt"
          content="Zandrel — Soluciones de software para tu negocio" />

    <!-- Structured Data -->

    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@graph": [
                {
                    "@type": "Organization",
                    "@id": "https://zandrel-software.github.io/zandrel-website/#organization",
                    "name": "Zandrel",
                    "url": "https://zandrel-software.github.io/zandrel-website/",
                    "description": "Soluciones de software profesionales, accesibles y adaptadas a las necesidades y presupuesto de tu negocio.",
                    "foundingDate": "2026",
                    "logo": {
                        "@type": "ImageObject",
                        "url": "https://zandrel-software.github.io/zandrel-website/images/brand/zandrel-logo-horizontal-transparent.png"
                    },
                    "image": "https://zandrel-software.github.io/zandrel-website/images/social/zandrel-social-preview.png",
                    "sameAs": [
                        "https://www.linkedin.com/company/zandrel/",
                        "https://github.com/zandrel-software"
                    ]
                },
                {
                    "@type": "WebSite",
                    "@id": "https://zandrel-software.github.io/zandrel-website/#website",
                    "url": "https://zandrel-software.github.io/zandrel-website/",
                    "name": "Zandrel",
                    "description": "Soluciones de software profesionales, accesibles y adaptadas a las necesidades y presupuesto de tu negocio.",
                    "inLanguage": "es-MX",
                    "publisher": {
                        "@id": "https://zandrel-software.github.io/zandrel-website/#organization"
                    }
                }
            ]
        }
    </script>

    <link rel="icon"
          type="image/png"
          href="images/brand/zandrel-mark-transparent.png" />

    <link rel="stylesheet"
          href="css/app.css" />

    <link rel="stylesheet"
          href="Zandrel.Web.styles.css" />

    <script type="importmap"></script>

</head>

<body>

    <div id="app">

        <div class="app-loading">

            <div class="app-loading__content">

                <img class="app-loading__mark"
                     src="images/brand/zandrel-mark-transparent.png"
                     alt="Zandrel" />

                <div class="app-loading__bar"
                     role="progressbar"
                     aria-label="Cargando Zandrel">
                </div>

            </div>

        </div>

    </div>

    <div id="blazor-error-ui">

        Ocurrió un error inesperado.

        <a href=""
           class="reload">
            Recargar
        </a>

        <button class="dismiss"
                type="button"
                aria-label="Cerrar mensaje de error">
            ×
        </button>

    </div>

    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>

</body>

</html>
