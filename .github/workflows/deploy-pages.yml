name: Deploy Zandrel Website

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Restore dependencies
        run: dotnet restore ./src/Zandrel.Web/Zandrel.Web.csproj

      - name: Publish Blazor WebAssembly
        run: >
          dotnet publish
          ./src/Zandrel.Web/Zandrel.Web.csproj
          --configuration Release
          --output ./publish
          --no-restore

      - name: Configure GitHub Pages base path
        shell: bash
        run: |
          PUBLISH_DIR="./publish/wwwroot"

          sed -i \
            's|<base href="/" />|<base href="/zandrel-website/" />|' \
            "$PUBLISH_DIR/index.html"

      - name: Configure static hosting files
        shell: bash
        run: |
          PUBLISH_DIR="./publish/wwwroot"

          touch "$PUBLISH_DIR/.nojekyll"
          cp "$PUBLISH_DIR/index.html" "$PUBLISH_DIR/404.html"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./publish/wwwroot

  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4