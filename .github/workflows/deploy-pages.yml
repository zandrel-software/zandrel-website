name: Deploy Zandrel Website

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Restore dependencies
        run: dotnet restore ./src/Zandrel.Web/Zandrel.Web.csproj

      - name: Publish Blazor WebAssembly
        run: >
          dotnet publish
          ./src/Zandrel.Web/Zandrel.Web.csproj
          --configuration Release
          --output ./publish
          --no-restore

      - name: Configure GitHub Pages deployment
        shell: bash
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -e

          PUBLISH_DIR="./publish/wwwroot"
          BASE_HREF="${BASE_PATH}/"

          echo "GitHub Pages base URL:  ${BASE_URL}"
          echo "GitHub Pages base path: ${BASE_PATH}"
          echo "Blazor base href:       ${BASE_HREF}"

          # Configure Blazor base path for the active Pages URL.
          sed -i \
            "s|<base href=\"/\" />|<base href=\"${BASE_HREF}\" />|" \
            "$PUBLISH_DIR/index.html"

          # Update public URLs in the generated artifact.
          for FILE in \
            "$PUBLISH_DIR/index.html" \
            "$PUBLISH_DIR/robots.txt" \
            "$PUBLISH_DIR/sitemap.xml"
          do
            if [ -f "$FILE" ]; then
              sed -i \
                "s|https://zandrel.com|${BASE_URL}|g" \
                "$FILE"
            fi
          done

          # Required for GitHub Pages static hosting.
          touch "$PUBLISH_DIR/.nojekyll"

          # Blazor SPA fallback.
          cp "$PUBLISH_DIR/index.html" "$PUBLISH_DIR/404.html"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./publish/wwwroot

  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5